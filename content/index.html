<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadcopter Viewer</title>

<style>
    :root {
        --ink: #eef4f1;
        --muted: #91a29c;
        --panel: rgba(13, 18, 18, 0.94);
        --line: rgba(255, 255, 255, 0.12);
        --cyan: #50d5e5;
        --amber: #f4b942;
        --coral: #ff6b5d;
        --green: #5bdb98;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        overflow: hidden;
        background: #0c1010;
        color: var(--ink);
        font-family: Bahnschrift, "Segoe UI Variable", sans-serif;
        letter-spacing: 0;
    }

    #overlay {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 12px 14px;
        background: rgba(8, 12, 12, 0.78);
        border: 1px solid var(--line);
        border-radius: 6px;
        z-index: 10;
        font-size: 13px;
        line-height: 1.55;
        backdrop-filter: blur(10px);
    }

    #tuning-panel {
        position: fixed;
        inset: 0 0 0 auto;
        width: min(430px, 40vw);
        min-width: 360px;
        z-index: 9;
        overflow-y: auto;
        padding: 22px;
        background: var(--panel);
        border-left: 1px solid var(--line);
        backdrop-filter: blur(18px);
        animation: panel-in 420ms ease-out both;
    }

    @keyframes panel-in {
        from { opacity: 0; transform: translateX(24px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .panel-header, .section-head, .apply-row, .metric-grid {
        display: flex;
        align-items: center;
    }

    .panel-header { justify-content: space-between; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 21px; font-weight: 650; }
    .eyebrow { color: var(--green); font: 600 11px/1 monospace; text-transform: uppercase; }
    .section-head { justify-content: space-between; margin-bottom: 10px; }
    h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; }

    .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--coral);
        box-shadow: 0 0 12px currentColor;
    }

    .status-dot.online { background: var(--green); }

    .arm-control {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        padding: 12px;
        background: #080c0c;
        border: 1px solid var(--line);
        border-radius: 6px;
    }
    .arm-state { color: var(--muted); font-size: 12px; }
    .arm-state strong { display: block; margin-top: 3px; color: var(--ink); font-size: 15px; }
    #arm-esc {
        min-width: 112px;
        padding: 10px 14px;
        border: 1px solid var(--coral);
        border-radius: 4px;
        background: transparent;
        color: var(--coral);
        font-weight: 700;
    }
    #arm-esc.armed { border-color: var(--green); background: var(--green); color: #07130d; }
    #arm-esc:disabled { opacity: 0.45; cursor: not-allowed; }

    .axis-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        margin-bottom: 18px;
        background: #080c0c;
        border: 1px solid var(--line);
        border-radius: 6px;
    }

    button, input { font: inherit; }
    button { color: var(--ink); cursor: pointer; }
    .axis-tab {
        height: 34px;
        border: 0;
        border-radius: 4px;
        background: transparent;
    }
    .axis-tab.active { background: #263130; color: var(--green); }

    .gain-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 12px;
    }

    label { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .gain-field input {
        width: 100%;
        margin-top: 6px;
        padding: 10px;
        color: var(--ink);
        background: #090d0d;
        border: 1px solid var(--line);
        border-radius: 4px;
        outline: none;
    }
    .gain-field input:focus { border-color: var(--green); }

    .apply-row { justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    .apply-row label { display: flex; align-items: center; gap: 7px; text-transform: none; }
    #apply-gains, #save-gains {
        min-width: 112px;
        padding: 10px 14px;
        border: 0;
        border-radius: 4px;
        color: #07130d;
        background: var(--green);
        font-weight: 700;
    }
    #save-gains { border: 1px solid var(--line); color: var(--ink); background: transparent; }
    #apply-gains:disabled, #save-gains:disabled { opacity: 0.45; cursor: not-allowed; }

    .chart-block { margin-bottom: 20px; }
    canvas {
        display: block;
        width: 100%;
        height: 170px;
        background: #080c0c;
        border: 1px solid var(--line);
        border-radius: 4px;
    }
    #output-chart { height: 100px; }
    .legend { display: flex; gap: 14px; color: var(--muted); font-size: 11px; }
    .legend span::before {
        content: "";
        display: inline-block;
        width: 14px;
        height: 2px;
        margin-right: 5px;
        vertical-align: middle;
        background: currentColor;
    }
    .legend .setpoint { color: var(--amber); }
    .legend .measurement { color: var(--cyan); }
    .legend .error { color: var(--coral); }

    .icon-button {
        width: 30px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        font-size: 18px;
        line-height: 1;
    }

    .metric-grid { align-items: stretch; gap: 1px; background: var(--line); }
    .metric {
        flex: 1;
        padding: 12px 8px;
        background: var(--panel);
    }
    .metric span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .metric strong { display: block; margin-top: 5px; font: 600 18px/1 monospace; }

    @media (max-width: 760px) {
        #overlay { top: 8px; left: 8px; font-size: 11px; }
        #tuning-panel {
            inset: auto 0 0 0;
            width: 100%;
            min-width: 0;
            height: 58vh;
            padding: 16px;
            border-left: 0;
            border-top: 1px solid var(--line);
        }
        canvas { height: 135px; }
    }
</style>
</head>
<body>

<div id="overlay">
    <div>Pitch: <span id="pitch">0.0</span>°</div>
    <div>Roll: <span id="roll">0.0</span>°</div>
    <div>Yaw: <span id="yaw">0.0</span>°</div>
    <div>Link: <span id="ws-status">connecting...</span></div>
    <div>Pad: <span id="pad-status">searching...</span></div>
    <div>Cmd: T <span id="cmd-throttle">0.00</span> R <span id="cmd-roll">0.00</span> P <span id="cmd-pitch">0.00</span> Y <span id="cmd-yaw">0.00</span></div>
</div>

<aside id="tuning-panel">
    <header class="panel-header">
        <div>
            <div class="eyebrow">Control Lab</div>
            <h1>PID tuning</h1>
        </div>
        <span id="tuning-status" class="status-dot" title="WebSocket status"></span>
    </header>

    <div class="arm-control">
        <div class="arm-state">Motor output<strong id="arm-state">Disarmed</strong></div>
        <button id="arm-esc" disabled>Arm ESC</button>
    </div>

    <div class="axis-tabs" role="tablist" aria-label="PID axis">
        <button class="axis-tab active" data-axis="roll" role="tab">Roll</button>
        <button class="axis-tab" data-axis="pitch" role="tab">Pitch</button>
    </div>

    <div class="gain-grid">
        <label class="gain-field">P<input id="gain-p" type="number" min="0" max="100" step="0.01" value="1.00"></label>
        <label class="gain-field">I<input id="gain-i" type="number" min="0" max="100" step="0.001" value="0.000"></label>
        <label class="gain-field">D<input id="gain-d" type="number" min="0" max="100" step="0.001" value="0.000"></label>
    </div>
    <div class="apply-row">
        <label><input id="apply-both" type="checkbox"> Apply to both axes</label>
        <button id="save-gains" disabled>Save</button>
        <button id="apply-gains" disabled>Apply gains</button>
    </div>

    <section class="chart-block">
        <div class="section-head">
            <h2>Response · degrees</h2>
            <button id="clear-history" class="icon-button" title="Clear graph" aria-label="Clear graph">×</button>
        </div>
        <canvas id="response-chart"></canvas>
        <div class="legend">
            <span class="setpoint">Setpoint</span>
            <span class="measurement">Measured</span>
            <span class="error">Error</span>
        </div>
    </section>

    <section class="chart-block">
        <div class="section-head"><h2>Controller output · normalized</h2></div>
        <canvas id="output-chart"></canvas>
    </section>

    <div class="metric-grid">
        <div class="metric"><span>Error</span><strong id="metric-error">0.00°</strong></div>
        <div class="metric"><span>RMS</span><strong id="metric-rms">0.00°</strong></div>
        <div class="metric"><span>Peak</span><strong id="metric-peak">0.00°</strong></div>
        <div class="metric"><span>Output</span><strong id="metric-output">0.000</strong></div>
    </div>
</aside>

<script type="module">
import * as THREE from './three.module.js';

// ---------------- Scene ----------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(5, 4, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ---------------- Lights ----------------

scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(5, 10, 5);
scene.add(sun);

// ---------------- Ground ----------------

const grid = new THREE.GridHelper(20, 20);
scene.add(grid);

// ---------------- Quadcopter ----------------

const quad = new THREE.Group();
scene.add(quad);

// Frame Material

const frameMat = new THREE.MeshStandardMaterial({
    color: 0x00aaff,
    metalness: 0.3,
    roughness: 0.6
});

// Body

const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 0.25, 0.9),
    frameMat
);

quad.add(body);

// Flight Controller Stack

const stack = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.2, 0.5),
    new THREE.MeshStandardMaterial({
        color: 0x333333
    })
);

stack.position.y = 0.25;
quad.add(stack);

// Arms

const armLength = 4.0;
const armThickness = 0.12;

const arm1 = new THREE.Mesh(
    new THREE.BoxGeometry(armLength, armThickness, armThickness),
    frameMat
);
arm1.rotation.y = Math.PI / 4;
quad.add(arm1);

const arm2 = new THREE.Mesh(
    new THREE.BoxGeometry(armLength, armThickness, armThickness),
    frameMat
);
arm2.rotation.y = -Math.PI / 4;
quad.add(arm2);

// Motors + Props

const motors = [];
const props = [];

function addMotor(x, z, clockwise)
{
    const motor = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.18, 0.18, 32),
        new THREE.MeshStandardMaterial({
            color: 0xff4444
        })
    );

    motor.position.set(x, 0, z);
    quad.add(motor);
    motors.push(motor);

    const prop = new THREE.Mesh(
        new THREE.CylinderGeometry(0.65, 0.65, 0.02, 32),
        new THREE.MeshStandardMaterial({
            color: 0xdddddd,
            transparent: true,
            opacity: 0.8
        })
    );

    prop.position.set(x, 0.12, z);

    prop.userData.clockwise = clockwise;

    quad.add(prop);
    props.push(prop);
}

const d = 1.4;

// Front Right
addMotor( d,  d, true);

// Front Left
addMotor(-d,  d, false);

// Rear Right
addMotor( d, -d, false);

// Rear Left
addMotor(-d, -d, true);

// Camera

const fpvCam = new THREE.Mesh(
    new THREE.BoxGeometry(0.25, 0.25, 0.25),
    new THREE.MeshStandardMaterial({
        color: 0xffff00
    })
);

fpvCam.position.set(0, 0.2, 0.55);
quad.add(fpvCam);

// ---------------- Telemetry ----------------

let pitch = 0;
let roll = 0;
let yaw = 0;
let activeGamepadIndex = null;
let gamepadSeq = 0;
let lastGamepadSendMs = 0;
let gamepadStatusText = "searching...";

const gamepadDisplay = {
    throttle: 0,
    roll: 0,
    pitch: 0,
    yaw: 0,
    buttons: 0,
    connected: false
};

const wsStatus = document.getElementById("ws-status");
const padStatus = document.getElementById("pad-status");
let reconnectDelayMs = 500;
let ws = null;
let activeAxis = "roll";

const pidState = {
    roll: { sp: 0, pv: 0, err: 0, out: 0, kp: 1, ki: 0, kd: 0 },
    pitch: { sp: 0, pv: 0, err: 0, out: 0, kp: 1, ki: 0, kd: 0 }
};
const gainDrafts = { roll: null, pitch: null };
const histories = { roll: [], pitch: [] };
const tuningStatus = document.getElementById("tuning-status");
const gainInputs = [
    document.getElementById("gain-p"),
    document.getElementById("gain-i"),
    document.getElementById("gain-d")
];
const applyButton = document.getElementById("apply-gains");
const saveButton = document.getElementById("save-gains");
const armButton = document.getElementById("arm-esc");
const armState = document.getElementById("arm-state");
const responseCanvas = document.getElementById("response-chart");
const outputCanvas = document.getElementById("output-chart");
let escArmed = false;
let pendingArmState = null;

function setStatus(text)
{
    wsStatus.textContent = text;
    tuningStatus.classList.toggle("online", text === "online");
    applyButton.disabled = text !== "online";
    saveButton.disabled = text !== "online";
    armButton.disabled = text !== "online" || pendingArmState !== null;
    if (text !== "online") {
        escArmed = false;
        pendingArmState = null;
        updateArmControl();
    }
}

function syncGainInputs()
{
    const state = pidState[activeAxis];
    const draft = gainDrafts[activeAxis];
    if (draft) {
        gainInputs.forEach((input, index) => input.value = draft[index]);
    } else {
        gainInputs[0].value = state.kp.toFixed(4);
        gainInputs[1].value = state.ki.toFixed(4);
        gainInputs[2].value = state.kd.toFixed(4);
    }
}

function updateArmControl()
{
    const displayedState = pendingArmState === null ? escArmed : pendingArmState;
    armState.textContent = pendingArmState === null
        ? (escArmed ? "Armed" : "Disarmed")
        : (pendingArmState ? "Arming..." : "Disarming...");
    armButton.textContent = displayedState ? "Disarm ESC" : "Arm ESC";
    armButton.classList.toggle("armed", displayedState);
    armButton.disabled = !ws || ws.readyState !== WebSocket.OPEN || pendingArmState !== null;
}

function sendArmRequest()
{
    if (!ws || ws.readyState !== WebSocket.OPEN || pendingArmState !== null) return;
    pendingArmState = !escArmed;
    ws.send(JSON.stringify({ t: "esc_arm", armed: pendingArmState }));
    updateArmControl();
}

function selectAxis(axis)
{
    activeAxis = axis;
    document.querySelectorAll(".axis-tab").forEach(button =>
        button.classList.toggle("active", button.dataset.axis === axis));
    syncGainInputs();
    drawCharts();
}

function sendPidGains()
{
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const values = gainInputs.map(input => Number(input.value));
    if (values.some(value => !Number.isFinite(value) || value < 0 || value > 100)) return;

    ws.send(JSON.stringify({
        t: "pid_tune",
        axis: document.getElementById("apply-both").checked ? "both" : activeAxis,
        kp: values[0],
        ki: values[1],
        kd: values[2]
    }));
}

function savePidGains()
{
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ t: "pid_save" }));
}

function gainsMatchDraft(axis)
{
    const draft = gainDrafts[axis];
    if (!draft) return false;
    const values = draft.map(Number);
    const state = pidState[axis];
    return values.every(Number.isFinite) &&
        Math.abs(values[0] - state.kp) < 0.00005 &&
        Math.abs(values[1] - state.ki) < 0.00005 &&
        Math.abs(values[2] - state.kd) < 0.00005;
}

function recordPidTelemetry(pid)
{
    for (const axis of ["roll", "pitch"]) {
        if (!pid[axis]) continue;
        Object.assign(pidState[axis], pid[axis]);
        if (gainsMatchDraft(axis)) gainDrafts[axis] = null;
        const history = histories[axis];
        history.push({ ...pidState[axis] });
        if (history.length > 300) history.shift();
    }
    syncGainInputs();
    updatePidMetrics();
    drawCharts();
}

function updatePidMetrics()
{
    const history = histories[activeAxis];
    const current = pidState[activeAxis];
    const rms = history.length
        ? Math.sqrt(history.reduce((sum, point) => sum + point.err * point.err, 0) / history.length)
        : 0;
    const peak = history.reduce((max, point) => Math.max(max, Math.abs(point.err)), 0);
    document.getElementById("metric-error").textContent = `${current.err.toFixed(2)}°`;
    document.getElementById("metric-rms").textContent = `${rms.toFixed(2)}°`;
    document.getElementById("metric-peak").textContent = `${peak.toFixed(2)}°`;
    document.getElementById("metric-output").textContent = current.out.toFixed(3);
}

function drawPlot(canvas, series, fixedRange = null)
{
    const ratio = window.devicePixelRatio || 1;
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    if (canvas.width !== width * ratio || canvas.height !== height * ratio) {
        canvas.width = width * ratio;
        canvas.height = height * ratio;
    }
    const context = canvas.getContext("2d");
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.clearRect(0, 0, width, height);

    const allValues = series.flatMap(item => item.values);
    const extent = fixedRange ?? Math.max(5, ...allValues.map(Math.abs)) * 1.15;
    context.strokeStyle = "rgba(255,255,255,.09)";
    context.lineWidth = 1;
    for (let row = 1; row < 4; row++) {
        const y = row * height / 4;
        context.beginPath(); context.moveTo(0, y); context.lineTo(width, y); context.stroke();
    }

    for (const item of series) {
        if (item.values.length < 2) continue;
        context.strokeStyle = item.color;
        context.lineWidth = item.width ?? 1.5;
        context.beginPath();
        item.values.forEach((value, index) => {
            const x = index * width / Math.max(1, item.values.length - 1);
            const y = height / 2 - (value / extent) * (height * 0.44);
            if (index === 0) context.moveTo(x, y); else context.lineTo(x, y);
        });
        context.stroke();
    }
}

function drawCharts()
{
    const history = histories[activeAxis];
    drawPlot(responseCanvas, [
        { values: history.map(point => point.sp), color: "#f4b942" },
        { values: history.map(point => point.pv), color: "#50d5e5", width: 2 },
        { values: history.map(point => point.err), color: "#ff6b5d" }
    ]);
    drawPlot(outputCanvas, [
        { values: history.map(point => point.out), color: "#5bdb98", width: 2 }
    ], 1);
}

function setPadStatus(text)
{
    gamepadStatusText = text;
    padStatus.textContent = text;
}

function applyDeadzone(value, deadzone)
{
    if (Math.abs(value) < deadzone) return 0;
    return value;
}

function clamp(value, min, max)
{
    return Math.min(max, Math.max(min, value));
}

function currentGamepad()
{
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];

    if (activeGamepadIndex !== null) {
        const active = pads[activeGamepadIndex];
        if (active && active.connected) {
            return active;
        }
    }

    for (const pad of pads) {
        if (pad && pad.connected) {
            activeGamepadIndex = pad.index;
            return pad;
        }
    }

    activeGamepadIndex = null;
    return null;
}

function buttonsToMask(buttons)
{
    const map = [0, 1, 2, 3, 4, 5, 8, 9, 10, 11];
    let mask = 0;
    for (let i = 0; i < map.length; i++) {
        if (buttons[map[i]]?.pressed) {
            mask |= (1 << i);
        }
    }
    return mask >>> 0;
}

function updateGamepadState()
{
    const pad = currentGamepad();
    if (!pad) {
        gamepadDisplay.connected = false;
        gamepadDisplay.throttle = 0;
        gamepadDisplay.roll = 0;
        gamepadDisplay.pitch = 0;
        gamepadDisplay.yaw = 0;
        gamepadDisplay.buttons = 0;
        setPadStatus("not connected");
        return;
    }

    const leftY = applyDeadzone(pad.axes[1] ?? 0, 0.08);
    const rightY = applyDeadzone(pad.axes[3] ?? 0, 0.08);
    const rightX = applyDeadzone(pad.axes[2] ?? 0, 0.08);

    gamepadDisplay.connected = true;
    gamepadDisplay.throttle = clamp(-leftY, 0, 1);
    gamepadDisplay.roll = 0;
    gamepadDisplay.pitch = clamp(-rightY, -1, 1);
    gamepadDisplay.yaw = clamp(rightX, -1, 1);
    gamepadDisplay.buttons = buttonsToMask(pad.buttons);

    const padName = pad.id.includes("Wireless Controller") ? "PS4" : pad.id;
    setPadStatus(`${padName} (${pad.mapping || "unknown"})`);
}

function sendGamepadState(nowMs)
{
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (nowMs - lastGamepadSendMs < 20) return;

    const payload = {
        t: "gamepad",
        connected: gamepadDisplay.connected,
        throttle: Number(gamepadDisplay.throttle.toFixed(3)),
        roll: Number(gamepadDisplay.roll.toFixed(3)),
        pitch: Number(gamepadDisplay.pitch.toFixed(3)),
        yaw: Number(gamepadDisplay.yaw.toFixed(3)),
        buttons: gamepadDisplay.buttons
    };

    const message = JSON.stringify(payload);
    if ((gamepadSeq++ % 50) === 0) {
        console.log("WS gamepad send", message.length, message);
    }

    ws.send(message);

    lastGamepadSendMs = nowMs;
}

function connectWebSocket()
{
    const url = `ws://${window.location.hostname}:81/ws`;
    ws = new WebSocket(url);

    ws.addEventListener("open", () =>
    {
        reconnectDelayMs = 500;
        setStatus("online");
    });

    ws.addEventListener("message", (event) =>
    {
        try
        {
            const data = JSON.parse(event.data);
            if (data.t !== "telemetry") return;

            if (typeof data.pitch === "number") pitch = data.pitch;
            if (typeof data.roll === "number")  roll = data.roll;
            if (typeof data.yaw === "number")   yaw = data.yaw;
            if (typeof data.armed === "boolean") {
                escArmed = data.armed;
                if (pendingArmState === escArmed ||
                    (typeof data.armRequested === "boolean" && data.armRequested !== pendingArmState)) {
                    pendingArmState = null;
                }
                updateArmControl();
            }
            if (data.pid) recordPidTelemetry(data.pid);
        }
        catch (err)
        {
            console.warn("Bad WS payload", err);
        }
    });

    ws.addEventListener("close", () =>
    {
        setStatus("reconnecting...");
        setTimeout(connectWebSocket, reconnectDelayMs);
        reconnectDelayMs = Math.min(reconnectDelayMs * 2, 5000);
    });

    ws.addEventListener("error", () =>
    {
        setStatus("error");
        ws.close();
    });
}

setInterval(() => {
    document.getElementById("pitch").textContent =
        pitch.toFixed(1);

    document.getElementById("roll").textContent =
        roll.toFixed(1);

    document.getElementById("yaw").textContent =
        yaw.toFixed(1);

    document.getElementById("cmd-throttle").textContent =
        gamepadDisplay.throttle.toFixed(2);

    document.getElementById("cmd-roll").textContent =
        gamepadDisplay.roll.toFixed(2);

    document.getElementById("cmd-pitch").textContent =
        gamepadDisplay.pitch.toFixed(2);

    document.getElementById("cmd-yaw").textContent =
        gamepadDisplay.yaw.toFixed(2);

    padStatus.textContent = gamepadStatusText;

}, 20);

connectWebSocket();

document.querySelectorAll(".axis-tab").forEach(button =>
    button.addEventListener("click", () => selectAxis(button.dataset.axis)));
gainInputs.forEach(input => input.addEventListener("input", () => {
    gainDrafts[activeAxis] = gainInputs.map(field => field.value);
}));
applyButton.addEventListener("click", sendPidGains);
saveButton.addEventListener("click", savePidGains);
armButton.addEventListener("click", sendArmRequest);
document.getElementById("clear-history").addEventListener("click", () => {
    histories[activeAxis].length = 0;
    updatePidMetrics();
    drawCharts();
});
drawCharts();

window.addEventListener("gamepadconnected", (event) =>
{
    activeGamepadIndex = event.gamepad.index;
    setPadStatus(`connected: ${event.gamepad.id}`);
});

window.addEventListener("gamepaddisconnected", (event) =>
{
    if (event.gamepad.index === activeGamepadIndex) {
        activeGamepadIndex = null;
    }
    setPadStatus("not connected");
});

// ---------------- Animation ----------------

function animate()
{
    requestAnimationFrame(animate);

    updateGamepadState();
    sendGamepadState(performance.now());

    quad.rotation.x =
        THREE.MathUtils.degToRad(pitch);

    quad.rotation.z =
        THREE.MathUtils.degToRad(roll);

    quad.rotation.y =
        THREE.MathUtils.degToRad(yaw);

    // Spin props

    for (const prop of props)
    {
        prop.rotation.y +=
            prop.userData.clockwise ? 0.6 : -0.6;
    }

    renderer.render(scene, camera);
}

animate();

// ---------------- Resize ----------------

window.addEventListener('resize', () =>
{
    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
    drawCharts();
});
</script>

</body>
</html>
